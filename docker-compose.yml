services:
  imagehub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: imagehub
    ports:
      - "8877:8877"
    environment:
      TZ: Asia/Shanghai
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: "change-this-password"
    volumes:
      - imagehub_data:/app/.data
    restart: unless-stopped

volumes:
  imagehub_data:
